name: keep-alive

on:
  schedule:
    # 错峰：避开整点 GitHub Actions 拥堵（*/5 含第 0 分钟，新 workflow 曾 110 分钟未触发）
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo to prevent free-tier spin down
        run: curl -sS -m 90 -o /dev/null -w "HTTP %{http_code}\n" https://group-leader-copilot.onrender.com/
      # 服务端定时扫描提醒：没人打开网页时也按 D-3 / D-1 / 过期当天生成提醒（扫描是幂等的，重复调用不会多生成）
      - name: Scan DDL reminders on schedule
        run: curl -sS -m 90 -X POST -o /dev/null -w "HTTP %{http_code}\n" https://group-leader-copilot.onrender.com/api/reminders/scan
