name: keep-alive

on:
  schedule:
    # 错峰：避开整点 GitHub Actions 拥堵（*/5 含第 0 分钟，新 workflow 曾 110 分钟未触发）
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo to prevent free-tier spin down
        run: curl -sS -m 90 -o /dev/null -w "HTTP %{http_code}\n" https://group-leader-copilot.onrender.com/